[package]
name = "flight-deck"
version = "0.2.2"
description = "Flight Deck — personal developer dashboard"
authors = ["Irakli Slivin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flight_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
futures = "0.3.34"
chrono = "0.4.45"
feed-rs = "2.4.0"
rrule = "0.14.0"
chrono-tz = "0.10.4"
notify-rust = "4.18.1"
tauri-plugin-single-instance = "2.5.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Direct access to the Outlook window's GTK widget (opacity, click-through) in outlook.rs.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# CloseNotification for "Clear notifications" (notifications.rs); already pulled in by notify-rust.
zbus = "5"

# Killing the mail brief's claude CLI process group on timeout (outlook.rs); already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
